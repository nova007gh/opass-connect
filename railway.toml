[build]
builder = "nixpacks"
buildCommand = "echo 'cache bust $(date)' && pnpm --filter @opass/api... build"

[deploy]
startCommand = "pnpm --filter @opass/api start"
preDeployCommand = "pnpm --filter @opass/api prisma:migrate"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

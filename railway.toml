[build]
builder = "nixpacks"
buildCommand = "pnpm --filter @opass/api... build"

[deploy]
startCommand = "pnpm --filter @opass/api start"
preDeployCommand = "pnpm --filter @opass/api prisma:resolve -- --rolled-back 20260828163129_add_business_location_candidate_user_security_notif && pnpm --filter @opass/api prisma:migrate"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

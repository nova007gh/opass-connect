services:
  - type: web
    name: opass-connect-api
    runtime: node
    branch: main
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run prisma:generate && pnpm --filter @opass/api build
    startCommand: pnpm --filter @opass/api start
    rootDir: .
    healthCheckPath: /health
    healthCheckTimeout: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: WEB_URL
        value: https://opass-connect.vercel.app
      - key: JWT_SECRET
        generateValue: true

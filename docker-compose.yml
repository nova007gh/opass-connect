services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opass
      POSTGRES_PASSWORD: opass
      POSTGRES_DB: opass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports: ["4000:4000"]
    depends_on: [postgres, redis]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
